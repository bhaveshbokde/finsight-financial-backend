spring:
  application:
    name: finsight

  # Loads KEY=VALUE pairs from ./.env (generated by scripts/provision-db.sh).
  # `.env` is .properties-shaped, so Spring's native config import handles it and
  # no extra dotenv dependency is needed. Absent file => ignored (CI uses real env vars).
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${FINSIGHT_DB_URL:jdbc:postgresql://127.0.0.1:5432/finsight_db}
    username: ${FINSIGHT_DB_USERNAME:finsight_app}
    password: ${FINSIGHT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: finsight-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000      # fail fast rather than hanging a request thread
      max-lifetime: 1800000
      validation-timeout: 3000

  jpa:
    # Flyway is the single source of truth for the schema. `validate` makes the
    # application refuse to start if an entity mapping drifts from the migrations.
    hibernate:
      ddl-auto: validate
    # OSIV keeps a database connection pinned to the request thread for the whole
    # request, which hides LazyInitializationException until production load. Off.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC             # every Instant round-trips as UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true             # `flyway:clean` can never run against this config

  data:
    redis:
      host: ${FINSIGHT_REDIS_HOST:localhost}
      port: ${FINSIGHT_REDIS_PORT:6379}
      password: ${FINSIGHT_REDIS_PASSWORD:}
      timeout: 2s                    # short: a slow cache must not slow the request
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${FINSIGHT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                      # no acknowledged write without full ISR replication
      retries: 5
      properties:
        enable.idempotence: true     # producer-side dedup of broker-level retries
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: ${FINSIGHT_KAFKA_CONSUMER_GROUP:finsight-import-processor}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false      # offsets commit only after the listener succeeds
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 600000 # a large CSV may legitimately take minutes
    listener:
      ack-mode: record
      concurrency: 2
      missing-topics-fatal: false    # app still boots when Kafka has no topics yet

  servlet:
    multipart:
      enabled: true
      max-file-size: ${FINSIGHT_IMPORT_MAX_FILE_SIZE:5MB}
      max-request-size: ${FINSIGHT_IMPORT_MAX_FILE_SIZE:5MB}

  threads:
    virtual:
      enabled: false                 # see docs/12 for why platform threads are kept

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never           # never leak internals through the default error page
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful
  tomcat:
    max-swallow-size: 6MB

# ---------------------------------------------------------------- application --
finsight:
  jwt:
    secret: ${FINSIGHT_JWT_SECRET}
    issuer: ${FINSIGHT_JWT_ISSUER:finsight}
    access-token-ttl: ${FINSIGHT_JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${FINSIGHT_JWT_REFRESH_TTL:P7D}
    clock-skew: PT30S

  csv-import:
    max-file-size-bytes: 5242880     # 5 MiB; also enforced by the multipart limits above
    max-rows: 50000
    # Imports with more rows than this are handed to Kafka instead of being
    # processed inline on the request thread.
    async-threshold-rows: 50
    allowed-content-types:
      - text/csv
      - application/vnd.ms-excel
      - text/plain
      - application/octet-stream

  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 100
    max-attempts: 10

  kafka:
    topics:
      import-requested: finsight.imports.requested.v1
      import-requested-dlt: finsight.imports.requested.v1.DLT
    retry:
      attempts: 3
      backoff-ms: 1000
      backoff-multiplier: 2.0

  cache:
    enabled: true
    report-ttl: PT10M
    category-ttl: PT30M

# --------------------------------------------------------------- observability --
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true                # /actuator/health/liveness + /readiness
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: finsight
  observations:
    key-values:
      application: finsight
  info:
    env:
      enabled: true

info:
  app:
    name: FinSight
    description: Financial transaction management and cash-flow analytics backend
    version: 1.0.0

# ------------------------------------------------------------------- openapi --
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.finsight: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{traceId:-},%X{userId:-}]){magenta} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"
